name: Build Docker

run-name: >-
  Build Docker
  ${{ github.event.action == 'cron-trigger-action'   && '[Cron]'   ||
      github.event.action == 'config-trigger-action' && '[Config]' ||
      github.event.action == 'client-trigger-action' && '[Client]' ||
      github.event.action == 'server-trigger-action' && '[Server]' || '' }}

on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Branches for multiarch build (JSON array)'
        required: false
        type: string

  repository_dispatch:
    types:
      - cron-trigger-action
      - config-trigger-action
      - client-trigger-action
      - server-trigger-action

env:
  DOCKER_PATH: "/install/docker"
  REPO: "onlyoffice"
  DOCKER_IMAGE_PREFIX: "4testing-apps"
  DOCKERFILE: "Dockerfile"

jobs:
  build:
    name: ${{ matrix.service }} (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ${{ github.event.client_payload.branches || fromJson(inputs.branches) }}
        service: [dotnet, node, java, community]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup BuildKit with /mnt support
        run: |
          docker rm -f buildkitd || true
          mountpoint -q /mnt && { sudo mkdir -p /mnt/buildkit; sudo chmod 777 /mnt/buildkit; STORAGE_ARGS="-v /mnt/buildkit:/var/lib/buildkit"; } || STORAGE_ARGS=""
          docker run -d --name buildkitd --privileged --network host ${STORAGE_ARGS} moby/buildkit:buildx-stable-1 --addr tcp://0.0.0.0:1234 --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host
          docker buildx create --name builder --driver remote tcp://127.0.0.1:1234 --use
          docker buildx inspect --bootstrap

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare build variables
        run: |
          PRODUCT_VERSION=$(echo "${{ matrix.branch }}" | sed '/^release\b\|^hotfix\b\|^feature\b\|^bugfix\b/s/release.*\/\|hotfix.*\/\|feature.*\/\|bugfix.*\///; s/-git-action$//; s/^v//')
          [ "${PRODUCT_VERSION}" = "develop" ] && PRODUCT_VERSION="develop"
          echo "DOCKER_TAG=${PRODUCT_VERSION}.${{ github.run_number }}" >> $GITHUB_ENV
          echo "PRODUCT_VERSION=${PRODUCT_VERSION}" >> $GITHUB_ENV
        shell: bash

      - name: Build ${{ matrix.service }}
        id: build
        timeout-minutes: 150
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          cd ".${DOCKER_PATH}"

          light_prune() {
            echo "-- light prune --"
            df -h . | tail -1
            docker buildx prune -f 2>/dev/null || true
            docker container prune -f 2>/dev/null || true
            docker image prune -f 2>/dev/null || true
          }

          full_cleanup() {
            printf '%.0s=' {1..80}
            echo
            echo "DISK SPACE AFTER BUILD"
            df -h
            docker system df
            printf '%.0s=' {1..80}
            echo
            docker buildx prune -a -f
            docker system prune -a -f --volumes
          }
          trap full_cleanup EXIT

          echo "PRODUCT_VERSION=${PRODUCT_VERSION}"

          build_bake() {
            local platforms="$1"
            local mode="$2"
            local tag_override="$3"   # optional; if set, pushes under this tag instead of DOCKER_TAG
            local -a options=(
              -f build/build.hcl
              "${{ matrix.service }}-services"
              --set "*.args.GIT_BRANCH=${{ matrix.branch }}"
              --set "*.args.PRODUCT_VERSION=${PRODUCT_VERSION}"
              --set "*.args.BUILD_NUMBER=${{ github.run_number }}"
              --set "*.platform=${platforms}"
              --set "*.secrets=id=github_token,env=GITHUB_TOKEN"
              --progress=plain
            )
            if [[ "$mode" == "push" ]]; then
              options+=(--sbom=true --provenance=mode=max --push)
            else
              options+=(--set "*.output=type=cacheonly")
            fi

            if [[ -n "$tag_override" ]]; then
              DOCKER_TAG="$tag_override" docker buildx bake "${options[@]}"
            else
              docker buildx bake "${options[@]}"
            fi
          }

          MULTI_LOG="${RUNNER_TEMP}/${{ matrix.service }}-multiarch.log"
          AMD64_LOG="${RUNNER_TEMP}/${{ matrix.service }}-amd64.log"
          ARM64_LOG="${RUNNER_TEMP}/${{ matrix.service }}-arm64.log"
          AMD64_PUSH_LOG="${RUNNER_TEMP}/${{ matrix.service }}-amd64-push.log"

          STEP_START=$SECONDS
          RETRY_DEADLINE=$(( 150 * 60 - 20 * 60 ))  # reserve 20 min for fallback push + cleanup
          MIN_FREE_KB=$((10 * 1024 * 1024))         # 10GB floor, tune to your images

          MULTI_ARCH_OK=false
          echo "Attempting multi-architecture build..."
          if build_bake "linux/amd64,linux/arm64" push 2>&1 | tee "$MULTI_LOG"; then
            MULTI_ARCH_OK=true
          fi
          light_prune

          if [[ "$MULTI_ARCH_OK" == "true" ]]; then
            echo "Multi-architecture build succeeded."
            echo "arch_fallback=false" >> "$GITHUB_OUTPUT"
            echo "arch_fallback_reason=none" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Multi-architecture build failed. Testing platforms separately."

            echo "Testing linux/amd64..."
            AMD64_DIAG_OK=false
            build_bake "linux/amd64" diagnostic 2>&1 | tee "$AMD64_LOG" && AMD64_DIAG_OK=true
            light_prune

            if [[ "$AMD64_DIAG_OK" != "true" ]]; then
              echo "::error::AMD64 also failed. The failure is not ARM64-specific."
              exit 1
            fi

            echo "AMD64 succeeded. Testing linux/arm64 separately..."
            ARM64_DIAG_OK=false
            build_bake "linux/arm64" diagnostic 2>&1 | tee "$ARM64_LOG" && ARM64_DIAG_OK=true
            light_prune

            if [[ "$ARM64_DIAG_OK" == "true" ]]; then
              AVAIL_KB=$(df --output=avail -k . | tail -1 | tr -d ' ')
              if [[ "$AVAIL_KB" -lt "$MIN_FREE_KB" ]]; then
                echo "::warning::Only $((AVAIL_KB / 1024 / 1024))GB free after pruning — skipping multi-arch retry, disk pressure makes it unlikely to succeed."
                RETRY_OK=false
              elif [[ "$SECONDS" -ge "$RETRY_DEADLINE" ]]; then
                echo "::warning::Not enough time budget left to attempt multi-arch retries — going straight to amd64-only fallback."
                RETRY_OK=false
              else
                RETRY_OK=false
                for attempt in 1 2; do
                  if [[ "$SECONDS" -ge "$RETRY_DEADLINE" ]]; then
                    echo "::warning::Time budget for retries exhausted, skipping remaining attempts."
                    break
                  fi
                  echo "::warning::Retrying full multi-arch push (attempt ${attempt}/2)..."
                  sleep 15
                  if build_bake "linux/amd64,linux/arm64" push 2>&1 | tee "${RUNNER_TEMP}/${{ matrix.service }}-multiarch-retry${attempt}.log"; then
                    RETRY_OK=true
                    light_prune
                    break
                  fi
                  light_prune
                done
              fi

              if [[ "$RETRY_OK" == "true" ]]; then
                echo "Multi-architecture push succeeded on retry."
                echo "arch_fallback=false" >> "$GITHUB_OUTPUT"
                echo "arch_fallback_reason=none" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::Multi-arch push still failing despite both platforms building independently — publishing under ${DOCKER_TAG}-amd64 only. Main tag stays untouched."
                if ! build_bake "linux/amd64" push "${DOCKER_TAG}-amd64" 2>&1 | tee "$AMD64_PUSH_LOG"; then
                  echo "::error::Failed to publish the ${DOCKER_TAG}-amd64 fallback tag."
                  exit 1
                fi
                echo "arch_fallback=true" >> "$GITHUB_OUTPUT"
                echo "arch_fallback_reason=manifest_or_push_issue" >> "$GITHUB_OUTPUT"
                echo "fallback_tag=${DOCKER_TAG}-amd64" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "::warning::AMD64 succeeded and ARM64 failed independently — confirmed ARM64-specific failure. Publishing under ${DOCKER_TAG}-amd64 only. Main tag stays untouched."
              if ! build_bake "linux/amd64" push "${DOCKER_TAG}-amd64" 2>&1 | tee "$AMD64_PUSH_LOG"; then
                echo "::error::Failed to publish the ${DOCKER_TAG}-amd64 fallback tag."
                exit 1
              fi
              echo "arch_fallback=true" >> "$GITHUB_OUTPUT"
              echo "arch_fallback_reason=arm64_build_failure" >> "$GITHUB_OUTPUT"
              echo "fallback_tag=${DOCKER_TAG}-amd64" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Attention!!! arm64 was skipped
        if: steps.build.outputs.arch_fallback == 'true'
        run: echo "::warning::${{ matrix.service }} (${{ matrix.branch }}) was pushed as amd64-only this run — arm64 temporarily unavailable under this tag"

  trigger-oci-docker:
    name: OCI (${{ matrix.branch }})
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ${{ github.event.client_payload.branches || fromJson(inputs.branches) }}
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Process branch ${{ matrix.branch }}
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_PAT }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_PAT }}
        run: |
          PRODUCT_VERSION=$(echo "${{ matrix.branch }}" | sed '/^release\b\|^hotfix\b\|^feature\b\|^bugfix\b/s/release.*\/\|hotfix.*\/\|feature.*\/\|bugfix.*\///; s/-git-action$//; s/^v//')
          DOCKER_TAG="${PRODUCT_VERSION}.${{ github.run_number }}"

          sudo GITHUB_REPOSITORY=${{ github.repository }} BRANCH=${{ matrix.branch }} \
            DOCKER_REPOSITORY=${{ env.REPO }} DOCKER_PREFIX=${{ env.DOCKER_IMAGE_PREFIX }} DOCKER_TAG=$DOCKER_TAG \
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME} DOCKERHUB_TOKEN=${DOCKERHUB_TOKEN} \
            bash .github/scripts/docker-images-availability.sh

          gh workflow run "ci-oci-docker-install.yml" --repo "${{ github.repository }}" --ref "${{ matrix.branch }}" --field offline=false --field testing=true --field tag=$DOCKER_TAG
