name: Build Docker

run-name: >-
  Build Docker
  ${{ github.event.action == 'cron-trigger-action'   && '[Cron]'   ||
      github.event.action == 'config-trigger-action' && '[Config]' ||
      github.event.action == 'client-trigger-action' && '[Client]' ||
      github.event.action == 'server-trigger-action' && '[Server]' || '' }}

on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Base branches (JSON; default: workflow branch)'
        required: false
        type: string
      branch-buildtools:
        description: 'Buildtools branch (default: base)'
        required: false
        type: string
      branch-server:
        description: 'Server branch (default: base, then develop)'
        required: false
        type: string
      branch-client:
        description: 'Client branch (default: base, then develop)'
        required: false
        type: string

  repository_dispatch:
    types:
      - cron-trigger-action
      - config-trigger-action
      - client-trigger-action
      - server-trigger-action

env:
  DOCKER_PATH: "/install/docker"
  REPO: "onlyoffice"
  DOCKER_IMAGE_PREFIX: "4testing-apps"
  DOCKERFILE: "Dockerfile"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.compute.outputs.branches }}
      builds: ${{ steps.compute.outputs.builds }}
    steps:
      - name: Compute Docker tags
        id: compute
        env:
          BRANCHES_JSON: >-
            ${{ github.event.client_payload.branches && toJSON(github.event.client_payload.branches) ||
                inputs.branches || format('[{0}]', toJSON(github.ref_name)) }}
          BRANCH_BUILDTOOLS: ${{ inputs.branch-buildtools }}
          BRANCH_SERVER: ${{ inputs.branch-server }}
          BRANCH_CLIENT: ${{ inputs.branch-client }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCHES=$(jq -c 'if type == "array" then map(tostring) else error("branches must be a JSON array") end' <<< "$BRANCHES_JSON")
          BUILDS='{}'
          while IFS= read -r BASE_BRANCH; do
            PRODUCT_VERSION=$(printf '%s' "$BASE_BRANCH" | sed '/^release\b\|^hotfix\b\|^feature\b\|^bugfix\b/s/release.*\/\|hotfix.*\/\|feature.*\/\|bugfix.*\///; s/-git-action$//; s/^v//')
            # The first override branch that differs from the base names the tag (buildtools, then server, then client).
            TAG_BRANCH="$BASE_BRANCH"
            for OVERRIDE in "$BRANCH_BUILDTOOLS" "$BRANCH_SERVER" "$BRANCH_CLIENT"; do
              if [ -n "$OVERRIDE" ] && [ "$OVERRIDE" != "$BASE_BRANCH" ]; then TAG_BRANCH="$OVERRIDE"; break; fi
            done
            TAG_PREFIX="$PRODUCT_VERSION"
            [ "$TAG_BRANCH" = "$BASE_BRANCH" ] || TAG_PREFIX="${PRODUCT_VERSION}-${TAG_BRANCH}"
            TAG_PREFIX=$(printf '%s' "$TAG_PREFIX" | LC_ALL=C sed 's/[^a-zA-Z0-9_.-]/-/g; s/^[.-]/_/; s/^$/build/' | cut -c1-100)
            BUILDS=$(jq -c --arg branch "$BASE_BRANCH" --arg tag "${TAG_PREFIX}.${GITHUB_RUN_NUMBER}" --arg version "$PRODUCT_VERSION" \
              '.[$branch] = {tag: $tag, version: $version}' <<< "$BUILDS")
          done < <(jq -r '.[]' <<< "$BRANCHES")
          jq . <<< "$BUILDS"
          echo "branches=${BRANCHES}" >> "$GITHUB_OUTPUT"
          echo "builds=${BUILDS}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.service }} (${{ matrix.branch }})
    needs: prepare
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ matrix.branch }}
      BUILDTOOLS_BRANCH: ${{ inputs.branch-buildtools || matrix.branch }}
      SERVER_BRANCH: ${{ inputs.branch-server }}
      CLIENT_BRANCH: ${{ inputs.branch-client }}
      DOCKER_TAG: ${{ fromJson(needs.prepare.outputs.builds)[matrix.branch].tag }}
      PRODUCT_VERSION: ${{ fromJson(needs.prepare.outputs.builds)[matrix.branch].version }}
    strategy:
      matrix:
        branch: ${{ fromJson(needs.prepare.outputs.branches) }}
        service: [dotnet, node, java, standalone]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILDTOOLS_BRANCH }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Setup BuildKit with /mnt support
        run: |
          docker rm -f buildkitd || true
          mountpoint -q /mnt && { sudo mkdir -p /mnt/buildkit; sudo chmod 777 /mnt/buildkit; STORAGE_ARGS="-v /mnt/buildkit:/var/lib/buildkit"; } || STORAGE_ARGS=""
          docker run -d --name buildkitd --privileged --network host ${STORAGE_ARGS} moby/buildkit:buildx-stable-1 --addr tcp://0.0.0.0:1234 --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host
          docker buildx create --name builder --driver remote tcp://127.0.0.1:1234 --use
          docker buildx inspect --bootstrap

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.service }}
        timeout-minutes: 90
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd .${DOCKER_PATH}
          docker buildx bake -f build/build.hcl ${{ matrix.service }}-services \
            --set "*.args.GIT_BRANCH=${BASE_BRANCH}" \
            --set "*.args.BUILDTOOLS_BRANCH=${BUILDTOOLS_BRANCH}" \
            --set "*.args.SERVER_BRANCH=${SERVER_BRANCH}" \
            --set "*.args.CLIENT_BRANCH=${CLIENT_BRANCH}" \
            --set "*.args.PRODUCT_VERSION=${PRODUCT_VERSION}" \
            --set "*.args.BUILD_NUMBER=${{ github.run_number }}" \
            --set "*.platform=linux/amd64,linux/arm64" \
            --set "*.secrets=id=github_token,env=GITHUB_TOKEN" \
            --sbom=true --provenance=mode=max --push
          
          # Clean up disk space after build
          printf '%.0s=' {1..80}; echo -e "\nDISK SPACE AFTER BUILD $(echo ${{ matrix.service }} | tr '[:lower:]' '[:upper:]')"; df -h; docker system df; printf '%.0s=' {1..80}; echo
          docker buildx prune -a -f; docker system prune -a -f --volumes

  trigger-oci-docker:
    name: OCI (${{ matrix.branch }})
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      BUILDTOOLS_BRANCH: ${{ inputs.branch-buildtools || matrix.branch }}
      DOCKER_TAG: ${{ fromJson(needs.prepare.outputs.builds)[matrix.branch].tag }}
    strategy:
      matrix:
        branch: ${{ fromJson(needs.prepare.outputs.branches) }}
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILDTOOLS_BRANCH }}

      - name: Process branch ${{ matrix.branch }}
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_PAT }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_PAT }}
        run: |
          # sudo keeps the exported variables by name, so the token never appears in its arguments
          export BRANCH="${BUILDTOOLS_BRANCH}" DOCKER_REPOSITORY="${{ env.REPO }}" DOCKER_PREFIX="${{ env.DOCKER_IMAGE_PREFIX }}" DOCKER_TAG
          sudo --preserve-env=GITHUB_REPOSITORY,BRANCH,DOCKER_REPOSITORY,DOCKER_PREFIX,DOCKER_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN \
            bash .github/scripts/docker-images-availability.sh

          gh workflow run "ci-oci-docker-install.yml" --repo "${GITHUB_REPOSITORY}" --ref "${BUILDTOOLS_BRANCH}" --field offline=false --field testing=true --field tag="$DOCKER_TAG"
