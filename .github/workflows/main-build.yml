name: Build Docker

run-name: >-
  Build Docker
  ${{ github.event.action == 'cron-trigger-action'   && '[Cron]'   ||
      github.event.action == 'config-trigger-action' && '[Config]' ||
      github.event.action == 'client-trigger-action' && '[Client]' ||
      github.event.action == 'server-trigger-action' && '[Server]' || '' }}

on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Base branches (JSON; default: workflow branch)'
        required: false
        type: string
      branch-buildtools:
        description: 'Buildtools branch (default: base)'
        required: false
        type: string
      branch-server:
        description: 'Server branch (default: base, then develop)'
        required: false
        type: string
      branch-client:
        description: 'Client branch (default: base, then develop)'
        required: false
        type: string
      archs:
        description: 'Architectures (JSON array), overrides the BUILD_ARCHS repo variable'
        required: false
        type: string
      trigger_oci:
        description: 'Trigger OCI install tests after the build'
        required: false
        type: boolean
        default: true

  repository_dispatch:
    types:
      - cron-trigger-action
      - config-trigger-action
      - client-trigger-action
      - server-trigger-action

env:
  DOCKER_PATH: "/install/docker"
  REPO: "onlyoffice"
  DOCKER_IMAGE_PREFIX: "4testing-apps"
  DOCKERFILE: "Dockerfile"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.vars.outputs.branches }}
      tags: ${{ steps.vars.outputs.tags }}
      versions: ${{ steps.vars.outputs.versions }}
      archs: ${{ steps.vars.outputs.archs }}
    steps:
      - name: Resolve branches and tags
        id: vars
        env:
          BRANCHES: ${{ toJson(github.event.client_payload.branches || fromJson(inputs.branches || format('[{0}]', toJSON(github.ref_name)))) }}
          BUILDTOOLS_BRANCH: ${{ inputs.branch-buildtools }}
          SERVER_BRANCH: ${{ inputs.branch-server }}
          CLIENT_BRANCH: ${{ inputs.branch-client }}
          # kill switch: set the BUILD_ARCHS repo variable to '["amd64"]' to stop building arm64 without a code change
          ARCHS: ${{ inputs.archs || vars.BUILD_ARCHS || '["amd64","arm64"]' }}
        run: |
          BRANCHES=$(jq -c '.' <<< "$BRANCHES")
          [ "$(jq 'length' <<< "$BRANCHES")" -gt 0 ] || { echo "::error::No branches to build"; exit 1; }

          TAGS='{}'
          VERSIONS='{}'
          while read -r BASE_BRANCH; do
            PRODUCT_VERSION=$(printf '%s' "$BASE_BRANCH" | sed '/^release\b\|^hotfix\b\|^feature\b\|^bugfix\b/s/release.*\/\|hotfix.*\/\|feature.*\/\|bugfix.*\///; s/-git-action$//; s/^v//')
            TAG_BRANCH="$BASE_BRANCH"
            for B in "$BUILDTOOLS_BRANCH" "$SERVER_BRANCH" "$CLIENT_BRANCH"; do
              [ -n "$B" ] && [ "$B" != "$BASE_BRANCH" ] && { TAG_BRANCH="$B"; break; }
            done
            TAG_PREFIX="$PRODUCT_VERSION"
            [ "$TAG_BRANCH" = "$BASE_BRANCH" ] || TAG_PREFIX="${PRODUCT_VERSION}-${TAG_BRANCH}"
            TAG_PREFIX=$(printf '%s' "$TAG_PREFIX" | LC_ALL=C sed 's/[^a-zA-Z0-9_.-]/-/g; s/^[.-]/_/; s/^$/build/' | cut -c1-100)
            TAGS=$(jq -c --arg b "$BASE_BRANCH" --arg t "${TAG_PREFIX}.${GITHUB_RUN_NUMBER}" '. + {($b): $t}' <<< "$TAGS")
            VERSIONS=$(jq -c --arg b "$BASE_BRANCH" --arg v "$PRODUCT_VERSION" '. + {($b): $v}' <<< "$VERSIONS")
          done < <(jq -r '.[]' <<< "$BRANCHES")

          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
          echo "$TAGS" | jq .

          ARCHS=$(jq -c 'unique' <<< "$ARCHS")
          jq -e 'index("amd64") != null and all(.[]; . == "amd64" or . == "arm64")' <<< "$ARCHS" > /dev/null \
            || { echo "::error::Invalid archs ${ARCHS}: amd64 is required, only amd64/arm64 are supported"; exit 1; }
          echo "archs=$ARCHS" >> "$GITHUB_OUTPUT"
          echo "Architectures: $ARCHS"

  build:
    name: ${{ matrix.service }}:${{ matrix.arch }} (${{ matrix.branch }})
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # arm64 is best-effort: its failure must not turn the run red, block the manifest or the OCI tests
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.prepare.outputs.branches) }}
        service: [dotnet, node, java, standalone]
        arch: ${{ fromJson(needs.prepare.outputs.archs) }}
    env:
      DOCKER_TAG: ${{ fromJson(needs.prepare.outputs.tags)[matrix.branch] }}
      PRODUCT_VERSION: ${{ fromJson(needs.prepare.outputs.versions)[matrix.branch] }}
      BASE_BRANCH: ${{ matrix.branch }}
      BUILDTOOLS_BRANCH: ${{ inputs.branch-buildtools || matrix.branch }}
      SERVER_BRANCH: ${{ inputs.branch-server }}
      CLIENT_BRANCH: ${{ inputs.branch-client }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILDTOOLS_BRANCH }}

      - name: Setup BuildKit with /mnt support
        run: |
          docker rm -f buildkitd || true
          mountpoint -q /mnt && { sudo mkdir -p /mnt/buildkit; sudo chmod 777 /mnt/buildkit; STORAGE_ARGS="-v /mnt/buildkit:/var/lib/buildkit"; } || STORAGE_ARGS=""
          docker run -d --name buildkitd --privileged --network host ${STORAGE_ARGS} moby/buildkit:buildx-stable-1 --addr tcp://0.0.0.0:1234 --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host
          docker buildx create --name builder --driver remote tcp://127.0.0.1:1234 --use
          docker buildx inspect --bootstrap

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.service }} (${{ matrix.arch }})
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd ".${DOCKER_PATH}"

          # push under the arch-specific tag, the manifest job publishes the common one
          DOCKER_TAG="${DOCKER_TAG}-${{ matrix.arch }}" docker buildx bake -f build/build.hcl ${{ matrix.service }}-services \
            --set "*.args.GIT_BRANCH=${BASE_BRANCH}" \
            --set "*.args.BUILDTOOLS_BRANCH=${BUILDTOOLS_BRANCH}" \
            --set "*.args.SERVER_BRANCH=${SERVER_BRANCH}" \
            --set "*.args.CLIENT_BRANCH=${CLIENT_BRANCH}" \
            --set "*.args.PRODUCT_VERSION=${PRODUCT_VERSION}" \
            --set "*.args.BUILD_NUMBER=${{ github.run_number }}" \
            --set "*.platform=linux/${{ matrix.arch }}" \
            --set "*.secrets=id=github_token,env=GITHUB_TOKEN" \
            --sbom=true --provenance=mode=max --progress=plain --push

      - name: Clean up disk space
        if: always()
        run: |
          printf '%.0s=' {1..80}; echo -e "\nDISK SPACE AFTER BUILD ${{ matrix.service }}:${{ matrix.arch }}"; df -h; docker system df; printf '%.0s=' {1..80}; echo
          docker buildx prune -a -f || true; docker system prune -a -f --volumes || true

      - name: Record build status
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/build-status"
          jq -n --arg branch "${{ matrix.branch }}" --arg service "${{ matrix.service }}" \
            --arg arch "${{ matrix.arch }}" --arg status "${{ job.status }}" \
            '{branch: $branch, service: $service, arch: $arch, status: $status}' \
            > "${RUNNER_TEMP}/build-status/build-${{ strategy.job-index }}.json"

      - name: Upload build status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-status-${{ strategy.job-index }}
          path: ${{ runner.temp }}/build-status/
          retention-days: 1

  manifest:
    name: manifest ${{ matrix.service }} (${{ matrix.branch }})
    needs: [prepare, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.prepare.outputs.branches) }}
        service: [dotnet, node, java, standalone]
    env:
      DOCKER_TAG: ${{ fromJson(needs.prepare.outputs.tags)[matrix.branch] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch-buildtools || matrix.branch }}
          sparse-checkout: install/docker/build

      - name: Download build statuses
        uses: actions/download-artifact@v4
        with:
          pattern: build-status-*
          path: ${{ runner.temp }}/statuses
          merge-multiple: true

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifests
        id: manifest
        run: |
          arch_status() {
            jq -rs --arg b "${{ matrix.branch }}" --arg s "${{ matrix.service }}" --arg a "$1" \
              'map(select(.branch == $b and .service == $s and .arch == $a))[0].status // "missing"' \
              "${RUNNER_TEMP}"/statuses/*.json
          }
          AMD64_STATUS=$(arch_status amd64)
          ARM64_STATUS=$(arch_status arm64)
          echo "amd64=${AMD64_STATUS}" >> "$GITHUB_OUTPUT"
          echo "arm64=${ARM64_STATUS}" >> "$GITHUB_OUTPUT"
          echo "AMD64: ${AMD64_STATUS} | ARM64: ${ARM64_STATUS}"

          if [[ "$AMD64_STATUS" != "success" ]]; then
            echo "::error::${{ matrix.service }} (${{ matrix.branch }}): amd64 build ${AMD64_STATUS} — manifest ${DOCKER_TAG} not published"
            exit 1
          fi

          ARCHS=(amd64)
          if [[ "$ARM64_STATUS" == "success" ]]; then
            ARCHS+=(arm64)
          else
            echo "::warning::${{ matrix.service }} (${{ matrix.branch }}): arm64 build ${ARM64_STATUS} — ${DOCKER_TAG} published as amd64-only"
          fi

          mapfile -t IMAGES < <(
            cd ".${DOCKER_PATH}" && DOCKER_TAG=__TAG__ docker buildx bake -f build/build.hcl ${{ matrix.service }}-services --print 2>/dev/null \
              | jq -r '.target[].tags[]' | sed 's/:__TAG__$//' | sort -u
          )
          [ ${#IMAGES[@]} -gt 0 ] || { echo "::error::No images resolved for ${{ matrix.service }}-services"; exit 1; }

          ERROR=0
          for IMAGE in "${IMAGES[@]}"; do
            SOURCES=()
            for ARCH in "${ARCHS[@]}"; do SOURCES+=("${IMAGE}:${DOCKER_TAG}-${ARCH}"); done
            for ATTEMPT in 1 2 3; do
              docker buildx imagetools create -t "${IMAGE}:${DOCKER_TAG}" "${SOURCES[@]}" && { echo "[OK]   ${IMAGE}:${DOCKER_TAG} (${ARCHS[*]})"; continue 2; }
              echo "[WAIT] ${IMAGE}:${DOCKER_TAG} attempt ${ATTEMPT}/3 failed, retrying..."
              sleep 20
            done
            echo "::error::Failed to create manifest ${IMAGE}:${DOCKER_TAG}"
            ERROR=1
          done
          [ "$ERROR" -eq 0 ] || exit 1

          printf '%s\n' "${IMAGES[@]}" > "${RUNNER_TEMP}/images.txt"
          echo "archs=${ARCHS[*]}" >> "$GITHUB_OUTPUT"

      - name: Delete arch-specific tags
        if: steps.manifest.outcome == 'success'
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_PAT }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_PAT }}
        run: |
          JWT=$(curl -fsSL -X POST "https://hub.docker.com/v2/users/login" -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" | jq -r '.token // empty')
          [ -n "$JWT" ] || { echo "::warning::Docker Hub login failed, arch-specific tags left in place"; exit 0; }

          while read -r IMAGE; do
            for ARCH in amd64 arm64; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: JWT ${JWT}" \
                "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${DOCKER_TAG}-${ARCH}/")
              case "$CODE" in
                204) echo "[DEL]  ${IMAGE}:${DOCKER_TAG}-${ARCH}" ;;
                404) ;;
                *)   echo "::warning::Unexpected status ${CODE} deleting ${IMAGE}:${DOCKER_TAG}-${ARCH}" ;;
              esac
            done
          done < "${RUNNER_TEMP}/images.txt"

      - name: Record manifest status
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/manifest-status"
          jq -n --arg branch "${{ matrix.branch }}" --arg service "${{ matrix.service }}" \
            --arg amd64 "${{ steps.manifest.outputs.amd64 || 'missing' }}" --arg arm64 "${{ steps.manifest.outputs.arm64 || 'missing' }}" \
            --arg status "${{ steps.manifest.outcome }}" --arg archs "${{ steps.manifest.outputs.archs }}" \
            '{branch: $branch, service: $service, amd64: $amd64, arm64: $arm64, status: $status, archs: $archs}' \
            > "${RUNNER_TEMP}/manifest-status/manifest-${{ strategy.job-index }}.json"

      - name: Upload manifest status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-status-${{ strategy.job-index }}
          path: ${{ runner.temp }}/manifest-status/
          retention-days: 1

  report:
    name: Report
    needs: [prepare, manifest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download manifest statuses
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-status-*
          path: ${{ runner.temp }}/statuses
          merge-multiple: true

      - name: Build summary
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          shopt -s nullglob
          FILES=("${RUNNER_TEMP}"/statuses/*.json)
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::No manifest statuses found"; exit 1; }

          icon() { case "$1" in success) echo "✅" ;; missing) echo "➖" ;; *) echo "❌ $1" ;; esac; }
          {
            echo "### Docker build #${{ github.run_number }}"
            echo
            echo "| Branch | Tag | Service | amd64 | arm64 | Manifest |"
            echo "|---|---|---|---|---|---|"
            jq -rs 'sort_by(.branch, .service)[] | [.branch, .service, .amd64, .arm64, .status, .archs] | @tsv' "${FILES[@]}" |
            while IFS=$'\t' read -r BRANCH SERVICE AMD64 ARM64 STATUS ARCHS; do
              TAG=$(jq -r --arg b "$BRANCH" '.[$b]' <<< "$TAGS")
              echo "| ${BRANCH} | \`${TAG}\` | ${SERVICE} | $(icon "$AMD64") | $(icon "$ARM64") | $(icon "$STATUS") ${ARCHS} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          ARM_FAILED=$(jq -rs '[.[] | select(.arm64 != "success") | "\(.service) (\(.branch))"] | join(", ")' "${FILES[@]}")
          [ -z "$ARM_FAILED" ] || echo "::warning::arm64 not included in the manifest for: ${ARM_FAILED}"

  trigger-oci-docker:
    name: OCI (${{ matrix.branch }})
    needs: [prepare, manifest]
    if: ${{ !cancelled() && inputs.trigger_oci != false }}
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.prepare.outputs.branches) }}
    env:
      DOCKER_TAG: ${{ fromJson(needs.prepare.outputs.tags)[matrix.branch] }}
      BUILDTOOLS_BRANCH: ${{ inputs.branch-buildtools || matrix.branch }}
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILDTOOLS_BRANCH }}

      - name: Download manifest statuses
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-status-*
          path: ${{ runner.temp }}/statuses
          merge-multiple: true

      - name: Check all services were published
        run: |
          shopt -s nullglob
          FILES=("${RUNNER_TEMP}"/statuses/*.json)
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::No manifest statuses found"; exit 1; }

          BRANCH_STATUS=$(jq -cs --arg b "${{ matrix.branch }}" 'map(select(.branch == $b))' "${FILES[@]}")
          NOT_PUBLISHED=$(jq -r '[.[] | select(.status != "success") | .service] | join(", ")' <<< "$BRANCH_STATUS")
          if [ "$(jq 'length' <<< "$BRANCH_STATUS")" -ne 4 ] || [ -n "$NOT_PUBLISHED" ]; then
            echo "::error::Not all services were published under ${DOCKER_TAG} for ${{ matrix.branch }} (failed: ${NOT_PUBLISHED:-unknown}) — OCI install not triggered"
            exit 1
          fi

      - name: Check image availability
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_PAT }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_PAT }}
        run: |
          sudo GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" BRANCH="${BUILDTOOLS_BRANCH}" \
            DOCKER_REPOSITORY=${{ env.REPO }} DOCKER_PREFIX=${{ env.DOCKER_IMAGE_PREFIX }} DOCKER_TAG=${DOCKER_TAG} \
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME} DOCKERHUB_TOKEN=${DOCKERHUB_TOKEN} \
            bash .github/scripts/docker-images-availability.sh

      - name: Trigger OCI install
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          gh workflow run "ci-oci-docker-install.yml" --repo "${GITHUB_REPOSITORY}" --ref "${BUILDTOOLS_BRANCH}" --field offline=false --field testing=true --field tag="${DOCKER_TAG}"
