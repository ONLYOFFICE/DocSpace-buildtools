name: Update OS-SUPPORT-LIST

on:
  push:
    paths:
      - '.github/workflows/ci-oci-install.yml'
    branches:
      - 'release/*'
      - 'hotfix/*'
  workflow_dispatch:

# The push goes to Gitea with GITEA_TOKEN, the GitHub token only reads
permissions:
  contents: read

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git config --global 'credential.https://${{ secrets.GITEA_HOST }}.helper' "store --file=${RUNNER_TEMP}/gitea-credentials"
          [[ "$GITEA_TOKEN" == *:* ]] || GITEA_TOKEN+=":"
          printf 'url=https://%s@%s\n\n' "$GITEA_TOKEN" '${{ secrets.GITEA_HOST }}' | git credential approve
          # The token file is needed only for the clone; the push step stores it again
          trap 'rm -f "${RUNNER_TEMP}/gitea-credentials"' EXIT
          git clone https://${{ secrets.GITEA_HOST }}/${{ github.repository }} -b "${GITHUB_REF_NAME}" --single-branch --depth=1

      # yq (mikefarah v4) comes preinstalled on the GitHub-hosted Ubuntu runners
      - name: Update OS list in README
        working-directory: ${{ github.event.repository.name }}
        run: |
          # Entries with distr "arm" are named "<OS> ARM": merge them into the matching x86 entry as "<OS> (x86_64, ARM64)"
          OS_LIST=$(yq -r '.jobs.prepare.steps[] | select(.name == "Set matrix names") | .env.OS_MAP' .github/workflows/ci-oci-install.yml \
            | jq -r '[.[]] as $all
                | [$all[] | select(.[1] == "arm") | .[0] | sub(" ARM$"; "")] as $arm
                | $all[] | select(.[1] != "arm") | .[0]
                | if IN($arm[]) then . + " (x86_64, ARM64)" else . end' \
            | awk 'NF{print "- "$0}')
          {
            echo '<!-- OS-SUPPORT-LIST-START -->'
            echo "$OS_LIST"
            echo '<!-- OS-SUPPORT-LIST-END -->'
          } > os_block.tmp
          awk '
            BEGIN {in_block=0}
            /<!-- OS-SUPPORT-LIST-START -->/ {while ((getline line < "os_block.tmp")>0) print line; in_block=1; next}
            /<!-- OS-SUPPORT-LIST-END -->/   {in_block=0; next}
            !in_block {print}
          ' install/OneClickInstall/README.md > README.new \
          && mv README.new install/OneClickInstall/README.md
          rm os_block.tmp
      - name: Commit changes (if any)
        working-directory: ${{ github.event.repository.name }}
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          [[ "$GITEA_TOKEN" == *:* ]] || GITEA_TOKEN+=":"
          printf 'url=https://%s@%s\n\n' "$GITEA_TOKEN" '${{ secrets.GITEA_HOST }}' | git credential approve
          trap 'rm -f "${RUNNER_TEMP}/gitea-credentials"' EXIT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add install/OneClickInstall/README.md
            git commit -m "Update OS list in OCI README"
            git pull --rebase --autostash
            git push
          else
            echo "No changes to commit"
          fi

