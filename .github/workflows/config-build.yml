name: Trigger Build [Config]

on:
  push:
    branches:
      - 'hotfix/v*'
      - 'release/v*'
      - 'develop'
    paths:
      - 'config/**'
      - 'install/docker/build/Dockerfile'
      - 'install/docker/build/entrypoints/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  select-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dispatch Action
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          gh api --method POST /repos/${{ github.repository }}/dispatches \
            -H "Accept: application/vnd.github+json" \
            -f event_type=config-trigger-action \
            -f client_payload[branches][]="${GITHUB_REF_NAME}"
