name: Static analysis

on:
  push:
    branches:
      - "hotfix/**"
      - "release/**"
      - "develop"
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "install/docker/**"
      - "tests/smoke/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1
  HADOLINT_IMAGE: hadolint/hadolint:v2.12.0
  ACTIONLINT_VERSION: 1.7.12.25
  YAMLLINT_VERSION: 1.38.0

jobs:
  Compose:
    name: Compose files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate every shipped Compose combination
        run: bash .github/scripts/docker-utils.sh compose-validate

  Dockerfiles:
    name: Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lint Dockerfiles with hadolint
        run: |
          FAILED=0
          for DOCKERFILE in install/docker/build/Dockerfile*; do
            echo "::group::$DOCKERFILE"
            docker run --rm -i "$HADOLINT_IMAGE" hadolint --failure-threshold error - < "$DOCKERFILE" || FAILED=1
            echo "::endgroup::"
          done
          exit "$FAILED"

  Workflows:
    name: Workflows and YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install linters
        run: pip install --disable-pip-version-check "actionlint-py==${ACTIONLINT_VERSION}" "yamllint==${YAMLLINT_VERSION}"

      # ShellCheck already runs on the shipped scripts in the OCI Docker workflow
      - name: Lint workflows with actionlint
        run: actionlint -shellcheck= -pyflakes=

      - name: Lint YAML with yamllint
        run: |
          yamllint -f github -d '{extends: relaxed, rules: {line-length: disable, new-lines: disable, indentation: disable, colons: disable, comments: disable, comments-indentation: disable, document-start: disable, trailing-spaces: disable, empty-lines: disable, truthy: {check-keys: false}}}' \
            .github/workflows install/docker config

  Smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r tests/smoke/requirements.txt pyflakes

      - name: Check Python sources
        run: python3 -m pyflakes tests/smoke

      - name: Collect tests
        run: python3 -m pytest tests/smoke/smoke_test.py --collect-only -q
