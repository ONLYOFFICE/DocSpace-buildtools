name: Release Docker Images

run-name: "Release Docker Images [${{ github.event.inputs.release_version }}]${{ github.event.inputs.services_filter != '' && ' (partial release)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'hub.docker repo owner (ex. onlyoffice)'
        type: string
        required: true
        default: 'onlyoffice'
      release_version:
        type: string
        description: 'Tag for stable release (ex. 2.5.1.1)'
        required: true
      source_version:
        type: string
        description: '4testing source tag (ex. 2.5.1.2678)'
        required: true
      services_filter:
        type: string
        description: 'Targets to release (ex. onlyoffice-node onlyoffice-api). Empty = all.'
        required: false
        default: ''
      trigger_offline_release:
        type: boolean
        description: 'Trigger offline release'
        required: false
        default: true
      overwrite_existing_tag:
        type: boolean
        description: 'Replace a release tag that already holds a different image'
        required: false
        default: false

permissions:
  contents: read

jobs:
  docker-release:
    name: "Release Docker"
    runs-on: ubuntu-latest
    environment: release
    steps:
    - name: Check the release branch
      run: |
        # Only a stable branch may publish release images
        [[ "${GITHUB_REF_NAME}" == master || "${GITHUB_REF_NAME}" == release/* || "${GITHUB_REF_NAME}" == hotfix/* ]] || { echo "::error::A release can be started only from master, release/* or hotfix/*, not from ${GITHUB_REF_NAME}"; exit 1 ; }

    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        repository: 'ONLYOFFICE/DocSpace-buildtools'

    - name: Login to DockerHub
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: "Release Docker images"
      shell: bash
      env:
        REPO: ${{ github.event.inputs.repo }}
        DOCKER_TAG: ${{ github.event.inputs.source_version }}
        RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        DOCKER_IMAGE_PREFIX: "4testing-apps"
        DOCKER_USERNAME_PAT: ${{ secrets.DOCKERHUB_USERNAME_PAT }}
        DOCKER_TOKEN_PAT: ${{ secrets.DOCKERHUB_TOKEN_PAT }}
        SERVICES_FILTER: ${{ github.event.inputs.services_filter }}
        ALLOW_TAG_OVERWRITE: ${{ github.event.inputs.overwrite_existing_tag }}
      run: |
        chmod +x ${GITHUB_WORKSPACE}/.github/scripts/release-docker.sh
        ${GITHUB_WORKSPACE}/.github/scripts/release-docker.sh

  trigger-offline-release:
    needs: docker-release
    if: ${{ needs.docker-release.result == 'success' && github.event.inputs.trigger_offline_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Docker Hub tag to appear
        shell: bash
        env:
          DOCKER_TAG: ${{ github.event.inputs.release_version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_PAT }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_PAT }}
          DOCKER_REPOSITORY: ${{ github.event.inputs.repo }}
        run: |
          echo "Waiting for images with tag ${DOCKER_TAG} to appear on Docker Hub..."
          # sudo keeps the exported variables by name, so the token never appears in its arguments
          export BRANCH="${GITHUB_REF_NAME}" DOCKER_PREFIX=apps
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/${GITHUB_REF_NAME}/.github/scripts/docker-images-availability.sh" \
            | sudo --preserve-env=GITHUB_REPOSITORY,BRANCH,DOCKER_REPOSITORY,DOCKER_PREFIX,DOCKER_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN bash

      - name: Trigger offline release
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          gh workflow run "offline-release.yml" --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}" --field trigger=true
