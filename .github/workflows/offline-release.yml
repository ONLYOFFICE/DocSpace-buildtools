name: Release Offline Archive

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Trigger creation of an offline archive'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: Upload offline self-extracting archive
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check the release branch
        run: |
          # Only a stable branch may publish the offline archive
          [[ "${GITHUB_REF_NAME}" == master || "${GITHUB_REF_NAME}" == release/* || "${GITHUB_REF_NAME}" == hotfix/* ]] || { echo "::error::A release can be started only from master, release/* or hotfix/*, not from ${GITHUB_REF_NAME}"; exit 1 ; }

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Trigger creation of an offline archive
        if: ${{ github.event.inputs.trigger == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          WORKFLOW_FILE: ci-oci-docker-install.yml
        run: |
          DISPATCH_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "ARCHIVE_BUILD_STARTED=${DISPATCH_TIME}" >> "$GITHUB_ENV"
          echo "Dispatching workflow #${WORKFLOW_FILE} on ${GITHUB_REPOSITORY} (ref=${GITHUB_REF_NAME})"
          gh workflow run "${WORKFLOW_FILE}" --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}" --field offline=true --field testing=false

          # Only the run created by this dispatch is accepted, not any other active run of the workflow
          FIND_DEADLINE=$((SECONDS + 120))
          until RUN_ID=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${WORKFLOW_FILE}" --branch "${GITHUB_REF_NAME}" \
              --event workflow_dispatch --created ">=${DISPATCH_TIME}" --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | .[0].databaseId // empty') && [ -n "$RUN_ID" ]; do
            [ "$SECONDS" -lt "$FIND_DEADLINE" ] || { echo "::error::[FAILED] Could not find the run started by this dispatch."; exit 1; }
            sleep 5
          done

          echo "Monitoring run #${RUN_ID}..."
          if gh run watch "${RUN_ID}" --repo "${{ github.repository }}" --interval 60 --exit-status; then
            echo "Workflow #${RUN_ID} finished successfully."
          else
            echo "::error::Workflow #${RUN_ID} terminated with error." && exit 1
          fi

      - name: Set environment variables
        run: |
          DOCKER_VERSION=$(curl -s https://hub.docker.com/v2/repositories/onlyoffice/apps-api/tags/ | jq -r '.results[].name' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)
          [ -n "$DOCKER_VERSION" ] || { echo "::error::Failed to determine DOCKER_VERSION"; exit 1; }
          echo "DOCKER_VERSION=${DOCKER_VERSION}" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=offline-apps-installation.sh" >> $GITHUB_ENV
          echo "ARTIFACT_ARM_NAME=offline-apps-installation-arm.sh" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_OCI }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_OCI }}
          aws-region: us-east-1

      - name: Verify the 4testing archives are fresh
        if: ${{ env.ARCHIVE_BUILD_STARTED != '' }}
        env:
          BUCKET_URL: ${{ secrets.AWS_BUCKET_URL_OCI }}
        run: |
          # The release copies the 4testing objects, so each one must have been written after this release started its build
          BUCKET_PATH="${BUCKET_URL#s3://}"
          BUCKET="${BUCKET_PATH%%/*}"
          KEY_PREFIX="${BUCKET_PATH#"$BUCKET"}"; KEY_PREFIX="${KEY_PREFIX#/}"; KEY_PREFIX="${KEY_PREFIX%/}"
          for NAME in "${ARTIFACT_NAME}" "${ARTIFACT_ARM_NAME}"; do
            MODIFIED=$(aws s3api head-object --bucket "$BUCKET" --key "${KEY_PREFIX:+$KEY_PREFIX/}offline/4testing-${NAME}" --query LastModified --output text)
            [ "$(date -u -d "$MODIFIED" +%s)" -ge "$(date -u -d "$ARCHIVE_BUILD_STARTED" +%s)" ] \
              || { echo "::error::4testing-${NAME} was last written at ${MODIFIED}, before the build started at ${ARCHIVE_BUILD_STARTED}"; exit 1; }
          done

      - name: Upload offline self-extracting archive (latest)
        run: |
          aws s3 cp ${{ secrets.AWS_BUCKET_URL_OCI }}/offline/4testing-${{ env.ARTIFACT_NAME }} \
            ${{ secrets.AWS_BUCKET_URL_OCI }}/offline/${{ env.ARTIFACT_NAME }} \
            --acl public-read --metadata-directive REPLACE
          aws s3 cp ${{ secrets.AWS_BUCKET_URL_OCI }}/offline/4testing-${{ env.ARTIFACT_ARM_NAME }} \
            ${{ secrets.AWS_BUCKET_URL_OCI }}/offline/${{ env.ARTIFACT_ARM_NAME }} \
            --acl public-read --metadata-directive REPLACE

      - name: Upload offline self-extracting archive (versioned)
        run: |
          aws s3 cp ${{ secrets.AWS_BUCKET_URL_OCI }}/offline/4testing-${{ env.ARTIFACT_NAME }} \
            ${{ secrets.AWS_BUCKET_URL_OCI }}/offline/${{ env.DOCKER_VERSION }}/${{ env.ARTIFACT_NAME }} \
            --acl public-read --metadata-directive REPLACE
          aws s3 cp ${{ secrets.AWS_BUCKET_URL_OCI }}/offline/4testing-${{ env.ARTIFACT_ARM_NAME }} \
            ${{ secrets.AWS_BUCKET_URL_OCI }}/offline/${{ env.DOCKER_VERSION }}/${{ env.ARTIFACT_ARM_NAME }} \
            --acl public-read --metadata-directive REPLACE

      - name: Invalidate AWS CloudFront cache
        run: |
          API_STATUS=$(aws apigateway test-invoke-method --rest-api-id ${{ secrets.AWS_REST_API_ID }} --resource-id "${{ secrets.AWS_RESOURCE_ID }}" \
            --http-method PUT --path-with-query-string "/prod/download-oo-com" --body "$(jq -c -n '.paths = $ARGS.positional' --args "/apps/offline/${{ env.ARTIFACT_NAME }}" "/apps/offline/${{ env.ARTIFACT_ARM_NAME }}" "/apps/offline/${{ env.DOCKER_VERSION }}/${{ env.ARTIFACT_NAME }}" "/apps/offline/${{ env.DOCKER_VERSION }}/${{ env.ARTIFACT_ARM_NAME }}")" \
            --region us-east-1 --query 'status' --output text || :)
          echo "API Gateway test-invoke status: ${API_STATUS:-<failed>}"
