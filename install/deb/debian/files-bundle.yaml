files:
  - name: "{{package_name}}-ai-worker.install"
    content: |
      debian/build/publish/services/ASC.AI.Worker/service var/www/{{package_sysname}}/{{product}}/products/ASC.AI

  - name: "{{package_name}}-ai.install"
    content: |
      debian/build/publish/services/ASC.AI/service/* var/www/{{package_sysname}}/{{product}}/products/ASC.AI/server/

  - name: "{{package_name}}-mcp.install"
    content: |
      debian/build/publish/services/ASC.AI.MCP/service/* var/www/{{package_sysname}}/{{product}}/products/ASC.AI/mcp

  - name: "{{package_name}}-api-system.install"
    content: |
      debian/build/publish/services/ASC.ApiSystem/service/* var/www/{{package_sysname}}/{{product}}/services/ASC.ApiSystem

  - name: "{{package_name}}-api.install"
    content: |
      debian/build/publish/services/ASC.Web.Api/service/* var/www/{{package_sysname}}/{{product}}/studio/ASC.Web.Api

  - name: "{{package_name}}-backup-worker.install"
    content: |
      debian/build/publish/services/ASC.Data.Backup.Worker/service/* var/www/{{package_sysname}}/{{product}}/services/ASC.Data.Backup.Worker

  - name: "{{package_name}}-backup.install"
    content: |
      debian/build/publish/services/ASC.Data.Backup/service/* var/www/{{package_sysname}}/{{product}}/services/ASC.Data.Backup

  - name: "{{package_name}}-clear-events.install"
    content: |
      debian/build/publish/services/ASC.ClearEvents/service/* var/www/{{package_sysname}}/{{product}}/services/ASC.ClearEvents

  - name: "{{package_name}}-common.install"
    content: |
      debian/build/buildtools/config/* etc/{{package_sysname}}/{{product}}
      debian/build/buildtools/install/common/{{product}}-configuration usr/bin
      debian/build/buildtools/install/docker/config/fluent-bit.conf etc/{{package_sysname}}/{{product}}

  - name: "{{package_name}}-common.dirs"
    content: |
      /var/log/{{package_sysname}}/{{product}}
      /etc/{{package_sysname}}/{{product}}/.private

  - name: "{{package_name}}-doceditor.install"
    content: |
      debian/build/publish/web/editor var/www/{{package_sysname}}/{{product}}/products/ASC.Files

  - name: "{{package_name}}-files-worker.install"
    content: |
      debian/build/publish/services/ASC.Files.Worker/service var/www/{{package_sysname}}/{{product}}/products/ASC.Files

  - name: "{{package_name}}-files.install"
    content: |
      debian/build/publish/services/ASC.Files/service/* var/www/{{package_sysname}}/{{product}}/products/ASC.Files/server/
      debian/build/DocStore var/www/{{package_sysname}}/{{product}}/products/ASC.Files/server

  - name: "{{package_name}}-healthchecks.install"
    content: |
      debian/build/publish/services/ASC.Web.HealthChecks.UI/service/* var/www/{{package_sysname}}/{{product}}/services/ASC.Web.HealthChecks.UI

  - name: "{{package_name}}-identity-api.install"
    content: |
      debian/build/publish/services/ASC.Identity.Registration/app.jar var/www/{{package_sysname}}/{{product}}/services/ASC.Identity.Registration

  - name: "{{package_name}}-identity-authorization.install"
    content: |
      debian/build/publish/services/ASC.Identity.Authorization/app.jar var/www/{{package_sysname}}/{{product}}/services/ASC.Identity.Authorization

  - name: "{{package_name}}-login.install"
    content: |
      debian/build/publish/web/login var/www/{{package_sysname}}/{{product}}/products/ASC.Login

  - name: "{{package_name}}-management.install"
    content: |
      debian/build/publish/web/management var/www/{{package_sysname}}/{{product}}/products/ASC.Management

  - name: "{{package_name}}-migration-runner.install"
    content: |
      debian/build/publish/services/ASC.Migration.Runner/service/* var/www/{{package_sysname}}/{{product}}/services/ASC.Migration.Runner

  - name: "{{package_name}}-notify.install"
    content: |
      debian/build/publish/services/ASC.Notify/service/* var/www/{{package_sysname}}/{{product}}/services/ASC.Notify

  - name: "{{package_name}}-people-server.install"
    content: |
      debian/build/publish/services/ASC.People/service/* var/www/{{package_sysname}}/{{product}}/products/ASC.People/server/

  - name: "{{package_name}}-plugins.install"
    content: |
      debian/build/plugins/publish/* var/www/{{package_sysname}}/Data/Studio/webplugins

  - name: "{{package_name}}-proxy.install"
    content: |
      debian/build/buildtools/install/common/{{product}}-ssl-setup usr/bin
      debian/build/buildtools/install/docker/config/nginx/nginx.conf.template etc/{{package_sysname}}/{{product}}/openresty
      debian/build/buildtools/config/nginx/html/*.html etc/openresty/html
      debian/build/buildtools/install/docker/config/nginx/proxy/onlyoffice* etc/openresty/conf.d
      debian/build/buildtools/config/nginx/onlyoffice*.conf etc/openresty/conf.d
      debian/build/buildtools/install/docker/config/nginx/proxy/letsencrypt* etc/openresty/includes
      debian/build/buildtools/config/nginx/includes/*.conf etc/openresty/includes
      debian/build/publish/web/public var/www/{{package_sysname}}/{{product}}
      debian/build/campaigns/src/campaigns var/www/{{package_sysname}}/{{product}}/public
      debian/build/publish/web/client var/www/{{package_sysname}}/{{product}}

  - name: "{{package_name}}-sdk.install"
    content: |
      debian/build/publish/web/sdk var/www/{{package_sysname}}/{{product}}/products/ASC.Sdk

  - name: "{{package_name}}-socket.install"
    content: |
      debian/build/publish/services/ASC.Socket.IO var/www/{{package_sysname}}/{{product}}/services

  - name: "{{package_name}}-newai.install"
    content: |
      debian/build/publish/services/ASC.NewAi var/www/{{package_sysname}}/{{product}}/services

  - name: "{{package_name}}-ssoauth.install"
    content: |
      debian/build/publish/services/ASC.SsoAuth var/www/{{package_sysname}}/{{product}}/services

  - name: "{{package_name}}-studio-notify.install"
    content: |
      debian/build/publish/services/ASC.Studio.Notify/service/* var/www/{{package_sysname}}/{{product}}/services/ASC.Studio.Notify

  - name: "{{package_name}}-studio.install"
    content: |
      debian/build/publish/services/ASC.Web.Studio/service/* var/www/{{package_sysname}}/{{product}}/studio/ASC.Web.Studio

  - name: "{{package_name}}-telegram.install"
    content: |
      debian/build/publish/services/ASC.TelegramService/service/* var/www/{{package_sysname}}/{{product}}/services/ASC.TelegramService
