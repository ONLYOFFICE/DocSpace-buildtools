services:
  onlyoffice-redis:
    image: ${REGISTRY}${REDIS_IMAGE_NAME}
    container_name: ${REDIS_CONTAINER_NAME}
    restart: always
    # An empty REDIS_PASSWORD keeps authentication disabled
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$$REDIS_PASSWORD\" ] || export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; redis-cli ping | grep -q PONG"]
      interval: 10s
      retries: 3
      start_period: 10s
      timeout: 10s

networks:
  default:
    name: ${NETWORK_NAME}
    external: true
